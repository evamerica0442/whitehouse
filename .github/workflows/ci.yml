name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI never talks to AWS or Neon. The mock provider and a dummy database URL are
  # enough to typecheck, lint, build, and run the unit suite.
  CLOUD_PROVIDER: mock
  JOB_DRIVER: memory
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
  SESSION_SECRET: ci-only-secret-value-at-least-32-chars
  AWS_MANAGEMENT_ACCOUNT_ID: '111122223333'

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Secret hygiene
        # A real .env was once committed here and survived because git keeps tracking
        # a file once added (gitignore does not untrack it). This step fails the build
        # if an environment file or an inline connection string is ever committed.
        run: |
          set -euo pipefail

          tracked_env="$(git ls-files | grep -E '^\.env$|^\.env\.' | grep -v '\.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "::error::Environment file is tracked in git: ${tracked_env}"
            exit 1
          fi

          leaks="$(git grep -lE 'postgres(ql)?://[^:/@[:space:]]+:[^@[:space:]]{6,}@' \
            -- . ':!*.example' ':!*.md' || true)"
          if [ -n "$leaks" ]; then
            echo "::error::Possible inline database credentials in: ${leaks}"
            exit 1
          fi

          echo "No tracked environment files or inline credentials."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # --include=dev keeps the build toolchain (prisma, tsx, typescript) present
        # even if NODE_ENV=production is ever set for the workflow.
        run: npm ci --include=dev

      - name: Generate Prisma client
        # packages/db generates the client from a postinstall too; this makes the
        # dependency explicit so CI never depends on lifecycle-script behaviour.
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck (packages + API)
        run: npx tsc -b --force

      - name: Unit tests
        run: npm run test

      - name: Build API
        run: npm run build -w @whitehouse/api

      - name: Typecheck + build web
        run: npm run build -w @whitehouse/web
